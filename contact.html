<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Argn0x</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Premium Ambient Background -->
  <div class="ambient-bg">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>
  <div class="bg-grid"></div>
  
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo"><a href="index.html" style="text-decoration:none;"><span class="logo-text">Argn0x</span></a></div>
      <ul class="nav-links">
        <li><a href="index.html#work">Work</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" style="color: var(--accent);">Contact</a></li>
      </ul>
    </div>
  </nav>

  <style>
    .contact-split {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 4rem;
      align-items: center;
    }
    .contact-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 900px) {
      .contact-split {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .contact-split .contact-text {
        text-align: center !important;
      }
      .contact-split .contact-text p {
        margin: 0 auto;
      }
      .contact-row {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <section class="contact-hero" style="padding: 120px 2rem 4rem; display: flex; justify-content: center; min-height: calc(100vh - 100px); align-items: center;">
    <div class="section-container contact-split" style="max-width: 1000px; width: 100%;">
      
      <!-- Left side: Text -->
      <div class="contact-text" style="text-align: left;">
        <div class="badge" style="margin-bottom: 1.5rem;">CONTACT</div>
        <h1 class="hero-title" style="font-size: 3.5rem; margin-bottom: 1.5rem; line-height: 1.1; letter-spacing: -2px;"><span class="gradient-text">Let's build<br>something<br>secure.</span></h1>
        <p style="font-size: 1.15rem; color: var(--text-muted); line-height: 1.8; max-width: 400px;">
          Have a tip, a project, or just want to connect? Drop me a message below and I'll get back to you as soon as possible.
        </p>
      </div>

      <!-- Right side: Form -->
      <div class="card" style="padding: 3rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);">
        <form action="https://formspree.io/f/xaqrngaq" method="POST" class="contact-form">
          <div class="contact-row">
            <div class="input-group" style="margin-bottom: 0;">
              <label for="name" style="color: var(--text); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; display: block;">Name</label>
              <input type="text" id="name" name="name" placeholder="John Doe" required style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; transition: all 0.3s; outline: none;" onfocus="this.style.borderColor='var(--text)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            </div>
            <div class="input-group" style="margin-bottom: 0;">
              <label for="email" style="color: var(--text); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; display: block;">Email</label>
              <input type="email" id="email" name="email" placeholder="john@example.com" required style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; transition: all 0.3s; outline: none;" onfocus="this.style.borderColor='var(--text)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            </div>
          </div>
          <div class="input-group" style="margin-bottom: 1.5rem;">
            <label for="message" style="color: var(--text); font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; display: block;">Message</label>
            <textarea id="message" name="message" rows="4" placeholder="How can I help you?" required style="width: 100%; padding: 1rem; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-family: 'Inter', sans-serif; transition: all 0.3s; outline: none; resize: none;" onfocus="this.style.borderColor='var(--text)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"></textarea>
          </div>
          <button class="btn btn-primary w-100" type="submit" style="padding: 1rem; border-radius: 12px; font-size: 1rem; font-weight: 700; width: 100%;">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <div class="logo"><span class="logo-text">Argn0x</span></div>
      <p>&copy; 2026 Argn0x. All rights reserved. SECURE. TRACE. UNMASK.</p>
      <div class="social-links">
        <a href="https://github.com/argn0x" target="_blank" aria-label="GitHub">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.02c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A4.8 4.8 0 0 0 8 18v4"></path></svg>
        </a>
        <a href="https://www.linkedin.com/in/argn0x/" target="_blank" aria-label="LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
